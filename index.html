<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de Uniformes BSR · Consulta de existencias</title>
<style>
:root{--navy:#172a46;--wine:#842b49;--bg:#f5f6f8;--muted:#617087}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--navy)}header{background:var(--navy);color:white;text-align:center;padding:30px 16px}header h1{margin:0;font-size:clamp(23px,5vw,34px)}header p{margin:9px 0 0;color:#e3e7ee}main{max-width:900px;margin:24px auto;padding:0 16px}.panel{background:white;border-radius:16px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 28px #172a4612}label{display:block;font-weight:700;margin-bottom:9px}select{width:100%;border:1px solid #bdc7d1;border-radius:9px;background:white;color:var(--navy);font-size:17px;padding:12px}h2{font-size:20px;margin:26px 0 10px}.status{color:var(--muted);min-height:24px;margin:13px 0}.chart{display:grid;gap:12px}.line{display:grid;grid-template-columns:46px minmax(0,1fr) 44px;gap:12px;align-items:center}.size{font-weight:700}.track{height:26px;border-radius:5px;background:#f0e8ec;overflow:hidden}.bar{height:100%;background:var(--wine);border-radius:5px;transition:width .25s ease}.count{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}.foot{font-size:13px;color:var(--muted);text-align:center;margin:20px 0 30px}button{border:0;background:var(--navy);color:white;border-radius:8px;padding:9px 15px;cursor:pointer;font-weight:650}button:hover{background:#294665}.actions{display:flex;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>
<header><h1>Banco de Uniformes BSR</h1><p>San Rafael Sr. Obispo · Consulta de existencias</p></header>
<main><section class="panel"><label for="prenda">Selecciona una prenda</label><select id="prenda" disabled><option>Cargando prendas…</option></select><h2 id="titulo">Existencias por talla</h2><div class="status" id="estado" role="status" aria-live="polite">Consultando el inventario…</div><div id="grafico" class="chart" aria-label="Existencias por talla"></div><div class="actions"><button type="button" id="actualizar">Actualizar existencias</button></div></section><p class="foot">Las cantidades son orientativas y pueden variar según las entregas y solicitudes.</p></main>
<script>
'use strict';
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1UDMphzKjESFRfX9PDlKlTwYmXm9s9zhTykwU3Q6fSBspXOqV5Vzax05lIhYjxJP2kDTXST8H_bB7/pub?gid=1986648746&single=true&output=csv';
const tallas=['02','04','06','08','10','12','14','16','18'];
const selector=document.getElementById('prenda'),grafico=document.getElementById('grafico'),estado=document.getElementById('estado'),titulo=document.getElementById('titulo');
let filas=[];
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(field);field='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field='';}else field+=c;}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function dibujar(){const codigo=selector.value,datos=filas.filter(f=>f.codigo===codigo),nombre=datos[0]?.nombre||'Existencias por talla';titulo.textContent=nombre;grafico.replaceChildren();const max=Math.max(1,...datos.map(f=>f.stock));for(const talla of tallas){const item=datos.find(f=>f.talla===talla),stock=item?.stock??0;const line=document.createElement('div');line.className='line';const size=document.createElement('span');size.className='size';size.textContent=talla;const track=document.createElement('div');track.className='track';const bar=document.createElement('div');bar.className='bar';bar.style.width=`${Math.max(0,stock)/max*100}%`;track.append(bar);const count=document.createElement('span');count.className='count';count.textContent=stock;line.append(size,track,count);grafico.append(line);}estado.textContent='Stock disponible por talla';}
async function cargar(){estado.textContent='Consultando el inventario…';try{const respuesta=await fetch(CSV_URL+'&_='+Date.now(),{cache:'no-store'});if(!respuesta.ok)throw new Error('No se pudo obtener el archivo CSV');const texto=await respuesta.text();const registros=parseCSV(texto.replace(/^\uFEFF/,''));const datos=registros.slice(1).filter(r=>r.length>=4&&r[0].trim()&&r[2].trim()).map(r=>({codigo:r[0].trim(),nombre:r[1].trim(),talla:r[2].trim().padStart(2,'0'),stock:Math.max(0,Number(r[3].trim().replace(',','.'))||0)}));if(!datos.length)throw new Error('El archivo no contiene existencias');filas=datos;const previo=selector.value;const opciones=[...new Map(filas.map(f=>[f.codigo,f.nombre])).entries()];selector.replaceChildren();for(const [codigo,nombre] of opciones){const option=document.createElement('option');option.value=codigo;option.textContent=nombre;selector.append(option);}selector.disabled=false;if(opciones.some(([codigo])=>codigo===previo))selector.value=previo;dibujar();}catch(error){estado.textContent='No se han podido cargar los datos. Pulsa «Actualizar existencias» para reintentar.';console.error(error);if(!filas.length){selector.replaceChildren(new Option('Sin datos disponibles',''));selector.disabled=true;grafico.replaceChildren();}}}
selector.addEventListener('change',dibujar);document.getElementById('actualizar').addEventListener('click',cargar);cargar();
</script>
</body></html>
